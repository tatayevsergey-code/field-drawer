name: CI Pipeline

# Запускать при каждом push в main и при создании Pull Request
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ==========================================
  # 1. Тесты Фронтенда (Node.js + Vitest/Jest)
  # ==========================================
  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'       # Автоматическое кэширование node_modules

      - name: Install dependencies
        run: npm ci          # ci гарантирует точную установку по package-lock.json

      - name: Run Frontend Tests
        run: npm run test:ci # Или просто npm test, если скрипт так называется
